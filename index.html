<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warehouse Event Board</title>
<meta name="description" content="Upcoming events that drive foot traffic to the Warehouse Food Hall, with staffing notes.">
<meta name="theme-color" content="#111418">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#111418; --panel:#1a1f26; --panel2:#222934; --line:#2e3744;
  --text:#eef2f6; --dim:#9aa7b6; --accent:#FF7A1A;
  --l0:#2a323d; --l0t:#c9d3de;
  --l1:#2f3d22; --l1t:#b8e07a;
  --l2:#5a3e0e; --l2t:#ffc35c;
  --l3:#6e1b27; --l3t:#ff9aa4;
  font-size:18px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:1.15rem;margin:0;letter-spacing:.02em;white-space:nowrap}
h1 span{color:var(--accent)}
.tabs{display:flex;gap:6px}
.tab{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 18px;min-height:48px;font-size:1rem}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#111;font-weight:700}
.fbtn{margin-left:auto;background:none;border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:48px;color:var(--dim)}
.fbtn.on{color:var(--accent);border-color:var(--accent)}
.filters{display:none;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.filters.open{display:flex}
.chip{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--panel);
  border-radius:999px;padding:7px 14px;min-height:44px;font-size:.9rem;opacity:.45}
.chip[aria-pressed="true"]{opacity:1;border-color:var(--c,var(--dim));background:var(--panel2)}
.chip i{width:12px;height:12px;border-radius:50%;background:var(--c,var(--dim));display:inline-block}
.sep{width:1px;height:28px;background:var(--line);margin:0 4px}
.mini{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;color:var(--dim);font-size:.85rem;min-height:40px}
main{padding:18px 16px 40px;max-width:1000px;margin:0 auto}

/* status colors */
.st{background:var(--l0);color:var(--l0t)}
.st.l1{background:var(--l1);color:var(--l1t)}
.st.l2{background:var(--l2);color:var(--l2t)}
.st.l3{background:var(--l3);color:var(--l3t)}

/* TODAY */
.hero{border-radius:20px;padding:22px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.hero .when{font-size:1rem;opacity:.85;text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.hero .big{font-size:3.2rem;font-weight:800;line-height:1;margin-top:6px}
.hero .sum{margin-left:auto;font-size:1.1rem;font-weight:600;text-align:right;max-width:420px}
.list{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.card{display:grid;grid-template-columns:150px 1fr;gap:16px;background:var(--panel);border:1px solid var(--line);
  border-left:8px solid var(--c);border-radius:16px;padding:16px 18px;align-items:start}
.card .tm{font-size:1.7rem;font-weight:800;line-height:1.1}
.card .tm small{display:block;font-size:.8rem;font-weight:600;color:var(--dim);margin-top:4px}
.card .ti{font-size:1.35rem;font-weight:700;line-height:1.25}
.card .ve{color:var(--dim);margin-top:4px}
.card .tip{margin-top:8px;color:#ffd9b8;font-size:1rem}
.card .staff{margin-top:6px;color:#fff;font-weight:700;font-size:1rem}
.card.past{opacity:.45}
.card.past .tm::after{content:"Done";display:block;font-size:.75rem;color:var(--dim);margin-top:2px}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:16px;padding:28px;text-align:center;color:var(--dim);font-size:1.2rem;margin-top:16px}
/* Today zone: tinted in today's status color, fading out at the bottom so "later" reads as separate */
.todayzone{padding:14px 14px 56px;border-radius:24px;
  background:linear-gradient(180deg,var(--tint) 0%,var(--tint) 60%,rgba(17,20,24,0) 100%)}
.todayzone.z0{--tint:rgba(60,72,88,.35)}
.todayzone.z1{--tint:rgba(75,105,45,.35)}
.todayzone.z2{--tint:rgba(150,100,20,.35)}
.todayzone.z3{--tint:rgba(170,40,60,.35)}
.later-h{display:flex;align-items:center;gap:14px;color:var(--dim);text-transform:uppercase;letter-spacing:.14em;
  font-size:.8rem;font-weight:700;margin:2px 0 4px}
.later-h::before,.later-h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(46,55,68,0),var(--line),rgba(46,55,68,0))}
.later .next{background:transparent;border-style:dashed;opacity:.8}
.next{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.next .lab{color:var(--dim);font-size:.85rem;text-transform:uppercase;letter-spacing:.08em}
.next b{font-size:1.1rem}

/* WEEK */
.whead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.whead h2{margin:0;font-size:1.25rem;flex:1;text-align:center}
.row{width:100%;display:grid;grid-template-columns:120px 130px 1fr;gap:14px;align-items:center;text-align:left;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:8px;min-height:72px}
.row.today{outline:3px solid var(--accent);outline-offset:-1px}
.row .d b{display:block;font-size:1.3rem}
.row .d span{color:var(--dim);font-size:.9rem}
.pillst{font-size:.85rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;text-align:center;
  padding:8px 10px;border-radius:999px;white-space:nowrap}
.row ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.row li{display:flex;gap:10px;align-items:baseline;font-size:1.05rem;line-height:1.3}
.row li .t{min-width:80px;font-weight:700;white-space:nowrap}
.row li i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;align-self:center}
.row .none{color:var(--dim)}

/* MONTH */
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{color:var(--dim);font-size:.75rem;text-transform:uppercase;text-align:center;padding:4px 0}
.cell{min-width:0;border:1px solid var(--line);border-radius:10px;min-height:70px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:6px}
.cell.out{opacity:.3}
.cell.today{outline:3px solid var(--accent);outline-offset:-1px}
.cell .num{font-weight:800;font-size:1.1rem}
.cell .dots{display:flex;gap:4px;flex-wrap:wrap}
.cell .dots i{width:10px;height:10px;border-radius:50%;background:var(--c)}

dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;max-width:720px;width:calc(100% - 32px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.6)}
.legend{color:var(--dim);font-size:.8rem;margin-top:24px;line-height:1.6}
.offline{display:none;background:#5a1d26;color:#ffd0d5;text-align:center;font-size:.85rem;padding:4px}
body.is-offline .offline{display:block}
@media (max-width:640px){
  :root{font-size:16px}
  .hero .big{font-size:2.4rem}.hero .sum{margin-left:0;text-align:left}
  .card{grid-template-columns:1fr;gap:6px}
  .row{grid-template-columns:1fr auto;gap:8px}
  .row ul{grid-column:1 / -1}
}
</style>
</head>
<body>
<div class="offline">Offline — showing the last saved schedule</div>
<header>
  <div class="top">
    <h1>Warehouse <span>Event Board</span></h1>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="today">Today</button>
      <button class="tab" role="tab" data-view="week">This Week</button>
      <button class="tab" role="tab" data-view="month">Month</button>
    </div>
    <button class="fbtn" id="fbtn" aria-expanded="false">Filters</button>
  </div>
  <div class="filters" id="filters"></div>
</header>
<main id="main"></main>
<dialog id="dlg"><div id="dlgBody"></div><p style="text-align:right;margin:14px 0 0"><button class="tab" onclick="dlg.close()">Close</button></p></dialog>

<script>
(() => {
  const W = {max:5, high:3, med:2, low:1};
  const LV = [["Normal","l0"],["Watch","l1"],["Busy","l2"],["Very busy","l3"]];
  const store = {
    get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
    set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  };
  let data = null;
  let view = store.get("view2", "today");
  let off = store.get("hidden", {});
  let offImp = store.get("hiddenImp", {});
  let weekOffset = 0, monthOffset = 0, filtersOpen = false;

  const $ = s => document.querySelector(s);
  const pad = n => String(n).padStart(2,"0");
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
  const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const DOWL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const fmtShort = d => `${MON[d.getMonth()]} ${d.getDate()}`;

  // Categories marked defaultOff (weekly regulars) stay hidden until someone turns them on
  const isOff = k => off[k] === undefined ? !!(data.categories[k] && data.categories[k].defaultOff) : !!off[k];
  const visible = e => !isOff(e.cat) && !offImp[e.impact];
  function eventsOn(dayIso){
    return data.events.filter(e => e.start <= dayIso && e.end >= dayIso && visible(e))
      .sort((a,b) => (mins(a.time) ?? -1) - (mins(b.time) ?? -1));
  }
  function level(list){
    const s = list.reduce((a,e) => a + W[e.impact], 0);
    return s === 0 ? 0 : s <= 2 ? 1 : s <= 4 ? 2 : 3;
  }
  function mins(t){
    const m = /^(\d{1,2}):(\d{2}) ?(AM|PM)$/i.exec(t || ""); if(!m) return null;
    return ((+m[1] % 12) + (m[3].toUpperCase()==="PM" ? 12 : 0)) * 60 + +m[2];
  }
  function clock(mi){ const h = Math.floor(mi/60), m = mi%60; return `${((h+11)%12)+1}:${pad(m)} ${h>=12?"PM":"AM"}`; }
  function timeLabel(e){
    if(e.time === "All day" || !e.time) return "All day";
    if(e.time === "TBA" || e.time === "TBD") return "Time TBA";
    return e.time;
  }
  function tip(e){
    if(e.cat === "convention") return "Convention across the street — bigger lunch rush and evening walk-ins.";
    if(e.cat === "weekly") return "Right outside the door — busy late morning through lunch.";
    if(e.time === "All day") return e.impact === "max" ? "Huge crowds all day — staff up every shift." : "Extra traffic all day.";
    const close = /next door|across|outside|Downtown/i.test(e.venue), m = mins(e.time);
    if(close && m != null) return `Rush likely ${clock(m-90)} – ${e.time}, then again after it ends.`;
    if(close) return "Next door — start time not posted yet.";
    if(e.impact === "low") return "On campus — small effect downtown.";
    return m != null ? `On campus — maybe some traffic around ${clock(m-90)} and after.` : "On campus — maybe some traffic before and after.";
  }
  const shortVenue = v => v.replace(/ \((next door|across the street|campus)\)/, " · $1");
  const daysSpan = e => e.start !== e.end ? ` · ${fmtShort(parse(e.start))}–${fmtShort(parse(e.end))}` : "";

  function card(e, isToday){
    const m = mins(e.time), now = new Date(), nowM = now.getHours()*60 + now.getMinutes();
    const past = isToday && m != null && nowM > m + 180;
    const c = data.categories[e.cat].color;
    return `<article class="card ${past?"past":""}" style="--c:${c}">
      <div class="tm">${esc(timeLabel(e))}<small>${esc(data.categories[e.cat].label)}</small></div>
      <div><div class="ti">${esc(e.title)}</div>
        <div class="ve">${esc(shortVenue(e.venue))}${esc(daysSpan(e))}</div>
        <div class="tip">${esc(tip(e))}</div>
        ${e.staff ? `<div class="staff">${esc(e.staff)}</div>` : ""}
        ${e.note ? `<div class="ve">${esc(e.note)}</div>` : ""}</div>
    </article>`;
  }

  function renderToday(){
    const t = today(), list = eventsOn(iso(t)), L = level(list);
    const sum = list.length === 0 ? "No events nearby today"
      : list.length === 1 ? "1 event today" : `${list.length} events today`;
    let h = `<div class="todayzone z${L}"><section class="hero st ${LV[L][1]}">
      <div><div class="when">Today · ${DOWL[t.getDay()]}, ${fmtShort(t)}</div><div class="big">${LV[L][0]}</div></div>
      <div class="sum">${sum}</div></section>`;
    h += list.length ? `<div class="list">${list.map(e => card(e, true)).join("")}</div>`
                     : `<div class="empty">Regular staffing — nothing tracked nearby today.</div>`;
    h += `</div><div class="later-h">Coming up · not today</div><div class="later">`;
    // Look ahead: tomorrow, then the next Busy+ day within 14 days
    const tm = addDays(t,1), tl = eventsOn(iso(tm)), TL = level(tl);
    h += `<div class="next"><span class="lab">Tomorrow</span><span class="pillst st ${LV[TL][1]}">${LV[TL][0]}</span>
      <b>${tl.length ? tl.map(e => `${esc(timeLabel(e))} ${esc(e.title)}`).join(" · ") : "Nothing tracked"}</b></div>`;
    for(let i=2; i<=14; i++){
      const d = addDays(t,i), dl = eventsOn(iso(d)), DL = level(dl);
      if(DL >= 2){
        h += `<div class="next"><span class="lab">Next busy day</span><span class="pillst st ${LV[DL][1]}">${LV[DL][0]}</span>
          <b>${DOWL[d.getDay()]} ${fmtShort(d)} — ${dl.map(e => esc(e.title)).join(" · ")}</b></div>`;
        break;
      }
    }
    $("#main").innerHTML = h + `</div>` + legend();
  }

  function renderWeek(){
    const start = addDays(today(), weekOffset*7), end = addDays(start, 6);
    let h = `<div class="whead">
      <button class="tab" data-w="-1" aria-label="Previous 7 days" ${weekOffset<=0?"disabled style='opacity:.3'":""}>◀</button>
      <h2>${weekOffset===0 ? "This week" : weekOffset===1 ? "Next week" : "Week of"} · ${fmtShort(start)} – ${fmtShort(end)}</h2>
      <button class="tab" data-w="1" aria-label="Next 7 days">▶</button></div>`;
    for(let i=0; i<7; i++){
      const d = addDays(start, i), di = iso(d), list = eventsOn(di), L = level(list);
      const isT = weekOffset===0 && i===0;
      h += `<button class="row ${isT?"today":""}" data-day="${di}">
        <div class="d"><b>${isT ? "Today" : DOW[d.getDay()]}</b><span>${fmtShort(d)}</span></div>
        <span class="pillst st ${LV[L][1]}">${LV[L][0]}</span>
        ${list.length ? `<ul>${list.map(e => `<li style="--c:${data.categories[e.cat].color}"><i></i><span class="t">${esc(timeLabel(e))}</span><span>${esc(e.title)}</span></li>`).join("")}</ul>`
                      : `<span class="none">—</span>`}
      </button>`;
    }
    $("#main").innerHTML = h + legend("Tap a day for details.");
  }

  function renderMonth(){
    const t = today(), first = new Date(t.getFullYear(), t.getMonth()+monthOffset, 1);
    const startGrid = addDays(first, -first.getDay());
    let h = `<div class="whead"><button class="tab" data-m="-1" aria-label="Previous month">◀</button>
      <h2>${first.toLocaleString("en-US",{month:"long",year:"numeric"})}</h2>
      <button class="tab" data-m="1" aria-label="Next month">▶</button></div>
      <div class="grid">${DOW.map(d=>`<div class="dow">${d}</div>`).join("")}`;
    for(let i=0; i<42; i++){
      const d = addDays(startGrid, i); if(i>=35 && d.getMonth()!==first.getMonth()) break;
      const di = iso(d), list = eventsOn(di), L = level(list);
      h += `<button class="cell st ${LV[L][1]} ${d.getMonth()!==first.getMonth()?"out":""} ${di===iso(t)?"today":""}" data-day="${di}">
        <span class="num">${d.getDate()}</span>
        <span class="dots">${list.map(e=>`<i style="--c:${data.categories[e.cat].color}"></i>`).join("")}</span></button>`;
    }
    $("#main").innerHTML = h + `</div>` + legend("Color = how busy. Tap a day for details.");
  }

  function legend(extra){
    const hidden = data.events.filter(e => !visible(e) && !(off[e.cat] === undefined && data.categories[e.cat].defaultOff)).length;
    return `<div class="legend">${extra ? extra + " " : ""}Normal → Watch → Busy → Very busy is based on how many events there are and how big.
      Rush times are estimates. ${hidden ? `<b>${hidden} events hidden by filters.</b> ` : ""}Schedule updated ${esc(data.updated)}.</div>`;
  }

  function renderFilters(){
    // Count only filters someone actually changed (a default-off category isn't "off" by choice)
    const nHidden = Object.keys(data.categories).filter(k => isOff(k) && !data.categories[k].defaultOff).length
      + Object.values(offImp).filter(Boolean).length;
    const fb = $("#fbtn");
    fb.textContent = filtersOpen ? "Close filters" : nHidden ? `Filters · ${nHidden} off` : "Filters";
    fb.classList.toggle("on", nHidden > 0);
    fb.setAttribute("aria-expanded", filtersOpen);
    $("#filters").classList.toggle("open", filtersOpen);
    if(!filtersOpen) return;
    let h = Object.entries(data.categories).map(([k,c]) =>
      `<button class="chip" style="--c:${c.color}" aria-pressed="${!isOff(k)}" data-cat="${k}"><i></i>${esc(c.label)}</button>`).join("");
    h += `<span class="sep"></span>` + ["max","high","med","low"].map(k =>
      `<button class="chip" aria-pressed="${!offImp[k]}" data-imp="${k}">${{max:"Huge",high:"High",med:"Medium",low:"Low"}[k]}</button>`).join("");
    h += `<button class="mini" data-all="1">Show all</button>`;
    $("#filters").innerHTML = h;
  }

  function render(){
    document.querySelectorAll(".tab[data-view]").forEach(b => b.setAttribute("aria-selected", b.dataset.view===view));
    renderFilters();
    if(view === "month") renderMonth(); else if(view === "week") renderWeek(); else renderToday();
  }

  document.addEventListener("click", ev => {
    const b = ev.target.closest("button"); if(!b || b.disabled) return;
    if(b.id === "fbtn"){ filtersOpen = !filtersOpen; renderFilters(); }
    else if(b.dataset.view){ view = b.dataset.view; weekOffset = 0; monthOffset = 0; store.set("view2", view); render(); }
    else if(b.dataset.cat){ off[b.dataset.cat] = !isOff(b.dataset.cat); store.set("hidden", off); render(); }
    else if(b.dataset.imp){ offImp[b.dataset.imp] = !offImp[b.dataset.imp]; store.set("hiddenImp", offImp); render(); }
    else if(b.dataset.all){ off = Object.fromEntries(Object.keys(data.categories).map(k => [k, false])); offImp = {};
      store.set("hidden", off); store.set("hiddenImp", offImp); render(); }
    else if(b.dataset.w){ weekOffset = Math.max(0, weekOffset + Number(b.dataset.w)); renderWeek(); }
    else if(b.dataset.m){ monthOffset += Number(b.dataset.m); renderMonth(); }
    else if(b.dataset.day){
      const d = parse(b.dataset.day), list = eventsOn(b.dataset.day), L = level(list), isT = b.dataset.day === iso(today());
      $("#dlgBody").innerHTML = `<section class="hero st ${LV[L][1]}" style="padding:16px 20px">
          <div><div class="when">${DOWL[d.getDay()]}, ${fmtShort(d)}</div><div class="big" style="font-size:2.2rem">${LV[L][0]}</div></div></section>
        ${list.length ? `<div class="list">${list.map(e => card(e, isT)).join("")}</div>` : `<div class="empty">Nothing tracked this day.</div>`}`;
      $("#dlg").showModal();
    }
  });

  async function load(){
    try{
      const r = await fetch("events.json", {cache:"no-store"});
      if(!r.ok) throw new Error(r.status);
      data = await r.json();
      document.body.classList.remove("is-offline");
      store.set("cache", data);
    }catch(e){
      data = data || store.get("cache", null);
      document.body.classList.add("is-offline");
      if(!data){ $("#main").innerHTML = `<p class="legend">Couldn't load the schedule. Check the internet connection.</p>`; return; }
    }
    render();
  }
  // KDS stays open: refresh data hourly; redraw every 5 min (marks finished events) and at midnight
  setInterval(load, 60*60*1000);
  setInterval(() => { if(data && !$("#dlg").open) render(); }, 5*60*1000);
  window.addEventListener("online", load);
  load();
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
</html>
