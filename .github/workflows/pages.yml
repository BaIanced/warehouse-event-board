name: Refresh and deploy

# Runs every morning with no outside help: reads the event sources, rebuilds events.json,
# and publishes the site. Also runs on every push to main and from the "Run workflow" button.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 11 * * *"        # 11:17 UTC = 4:17 AM (winter) / 5:17 AM (summer) in Boise
  workflow_dispatch:

permissions:
  contents: write                # lets the job save data/auto.json back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Read event sources
        id: scrape
        continue-on-error: true    # a source being down must never block publishing
        run: python tools/scrape.py --strict

      - name: Build events.json
        run: python tools/build_events.py | tee build.log

      - name: Build icons
        run: |
          python -m pip install --upgrade pillow
          python tools/make_icons.py

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js events.json _site/
          cp -r icons _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Save the last good copy of each source
        run: |
          git config user.name "event-board-bot"
          git config user.email "event-board-bot@users.noreply.github.com"
          git add data/auto.json
          if git diff --cached --quiet; then
            echo "nothing to save"
          else
            git commit -m "Auto refresh $(date -u +%F)"
            git push || echo "push skipped (someone else pushed first); tomorrow's run will catch up"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Event board refresh"
            echo '```'
            grep -v '^TIME' build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Flag sources that have been failing for days
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::error::One or more event sources have failed for more than 3 days. See the 'Read event sources' step."
          exit 1
